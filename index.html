<style>
  body{font-family:Georgia,serif;max-width:760px;margin:0 auto;padding:16px;background:#f6f6f4;color:#1a1a1a;line-height:1.55}
  h1{font-size:1.4rem;margin:8px 0 4px}
  .sub{color:#666;font-size:.9rem;margin-bottom:20px;font-family:system-ui,sans-serif}
  .q{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin-bottom:18px}
  .num{font-family:system-ui,sans-serif;font-weight:700;font-size:.85rem;color:#fff;background:#111;border-radius:4px;padding:2px 8px;display:inline-block;margin-bottom:8px}
  .passage{margin:6px 0 12px;text-align:justify}
  .ask{font-family:system-ui,sans-serif;font-weight:700;margin:10px 0}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;font-family:system-ui,sans-serif;font-size:.95rem}
  .opt:hover{background:#f0f0f0}
  .opt.sel{border-color:#1a56db;background:#e8f0fe}
  .opt b{color:#9b1c1c;min-width:16px}
  .opt.cross{opacity:.45;text-decoration:line-through}
  .hint{font-size:.75rem;color:#888;font-family:system-ui,sans-serif}
  .reset{font-family:system-ui,sans-serif;padding:8px 14px;border:1px solid #999;background:#fff;border-radius:6px;cursor:pointer}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0;font-family:system-ui,sans-serif}
  .nav button{padding:10px 18px;border:0;border-radius:8px;background:#9b1c1c;color:#fff;font-weight:600;cursor:pointer;font-size:.95rem}
  .nav button:disabled{background:#bbb;cursor:default}
  .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 16px;font-family:system-ui,sans-serif}
  .dot{width:32px;height:32px;border-radius:6px;border:1px solid #bbb;background:#fff;cursor:pointer;font-weight:600}
  .dot.cur{background:#111;color:#fff;border-color:#111}
  .dot.done{background:#e8f0fe;border-color:#1a56db}
  .dot.cur.done{background:#1a56db;border-color:#1a56db;color:#fff}
  .counter{font-size:.9rem;color:#444}
</style>

<body>
<h1>Inferences 1</h1>

<div id="app"></div>
<div class="nav">
  <button id="prev" onclick="go(-1)">Previous</button>
  <span class="counter" id="counter"></span>
  <button id="next" onclick="go(1)">Next</button>
</div>
<button class="reset" onclick="resetAll()">Tümünü sıfırla</button>

<script>
const Q = [
{p:"The Nacional tree is a rare variety of cacao. Nacionals were thought to have gone extinct by the twentieth century due to a fungus. This fungus can spread from tree to nearby tree through the air and causes disease. But around 2013, cacao expert Servio Pachard located some of these Nacional trees. The trees were in the Piedra de Plata coastal forest, within a hard-to-reach valley in Ecuador. Conservationists inferred that the Nacional trees in Piedra de Plata might have avoided the diseases that wiped out the other Nacionals because",
 o:["early twentieth-century scientists did not know why so many Nacionals were becoming infected.","the ability of the fungus to travel through the air was only recently discovered.","they were too far from the other Nacional trees infected by the fungus to become infected themselves.","the chocolate made from their pods was highly valued."]},
{p:"Bengali author and activist Rokeya Sakhawat Hossain, better known as Begum Rokeya, is widely regarded as a pioneer of women's liberation in South Asia. She established the first school aimed primarily at Muslim girls in Kolkata, India, and founded the Muslim Women's Association, which fought for women's education and employment. These accomplishments most strongly imply that",
 o:["Rokeya moved to Kolkata because it offered a multitude of opportunities for women.","Rokeya was educated at an institution similar to the one she would later establish.","Rokeya believed education to be an important component of women's liberation.","Rokeya was disheartened at the lack of employment opportunities for women in India."]},
{p:"Individualism is a moral stance and political philosophy that emphasizes the intrinsic worth of the individual. The term has been used both positively and negatively throughout history. For example, Welsh textile manufacturer Robert Owen used the word individualism as an insult, as he believed that cooperation, rather than individual desires, was the key to a successful society. Conversely, British journalist James Elishama Smith argued that without individualism, the moments of genius that have improved the quality of life for all of humanity would not be possible. Smith's argument suggests that",
 o:["morality is a complicated topic best left to philosophers rather than businessmen.","Owen was correct to be wary of individualism, as it often hinders genius.","the philosophy of individualism may not be wholly detrimental to societal progress.","the word individualism causes too much confusion and must be replaced with a more precise term."]},
{p:"First published in 1896, the <i>International Cloud Atlas</i> is a pictorial key for the nomenclature, or naming, of clouds. The initial purpose of the <i>Atlas</i> was to train meteorologists and promote consistent vocabulary terms for describing clouds across the weather forecast industry. In later years, the illustrations of cloud types that would appear in the <i>Atlas</i> were so beautiful that laypeople would purchase a copy of the book for their own enjoyment. This expansion in ownership of the <i>Atlas</i> most directly implies that",
 o:["the publication has focused more on beautiful illustrations than on cloud nomenclature.","the publication is valued by an audience separate from the publication's original target group.","laypeople have become more interested in the promotion of consistent cloud nomenclature.","laypeople can accurately forecast the weather by learning from the International Cloud Atlas."]},
{p:"To gain insight into the effects of prescription medication, Dr. Amjay Gordon asked for help from a medical examiner, who provided Gordon and her team with sixty-two different examples of individuals who had died of prescription drug overdoses. Using the documentation, particularly past medical histories and toxicology reports, Gordon's team found that accidental mixed drug toxicity accounted for 78% of the deaths, of which 83% included at least one prescription drug. Additionally, 79% of the mixed drug toxicity deaths had been caused by one specific combination—fentanyl (a prescription opioid) and heroin. These statistics imply that",
 o:["doctors and medical examiners should collaborate more frequently to better understand the proper administration of prescription drugs.","a combination of two or more drugs can have unintended consequences for the body.","even if one of the drugs is prescribed by a doctor.","doctors should cease the prescription of fentanyl completely until Dr. Gordon's work is verified by an outside party."]},
{p:"Dr. Moshe Nagari of the Hebrew University of Jerusalem has made a career of studying when, how, and why animals sleep. One of his hypotheses was that like humans, animals must sometimes sacrifice shut-eye when they've got important work to do—such as tending to their young. Nagari focused his attention on bumblebee colonies. In these colonies, a queen lays the eggs, and worker bees called nurses care for the resulting hatchlings. Nagari placed nurse bees in an enclosure with larvae, a developmental bee stage that requires constant feeding. The nurse bees slept significantly less than did bees who did not have larvae to care for. This finding suggests that",
 o:["the role of the nurse bees in the colony was exclusively to feed new hatchlings.","the nurse bees' sleep was shorter when caring for the larvae but longer once the larvae had developed.","the observed sleep patterns of the nurse bees were consistent with the hypothesis made by Nagari.","the nurse bees slept less due to their desire to protect the larvae from harm rather than for feeding purposes."]},
{p:"According to exercise psychologist Brett Gordon at the Penn State College of Medicine, while medication is an effective treatment for depression, patients should not overlook the impact of physical activity. Unlike medication, which can take weeks or months to take effect, the boon to one's mood from exercise is nearly immediate. Gordon also notes an additional benefit of exercise as mental health therapy: since a common side effect of depression is weight gain, the exercise can counteract that side effect. The fact that other psychologists are beginning to prescribe daily exercise along with traditional medications, therefore,",
 o:["reveals that the field of psychology is beginning to debate whether medication should still be used to treat depression.","provides evidence that at least some other mental health professionals agree with Gordon's philosophy.","encourages Gordon to expand the scope of his message beyond his colleagues at Penn State.","demonstrates the beginning of a trend towards a societal synthesis of physical and mental health advice."]},
{p:"Throughout human history, each culture has developed its own specific set of funerary rituals. Many people believe that the life or essence or spirit of an individual extends in some form beyond death, and the way in which people are laid to rest often reflects how different groups envision this unseen world after life. A wide variety of ancient peoples developed elaborate ceremonies to mark this transition to the afterlife, including placing both valuable materials (such as gold) and practical items (such as food offerings) in the spot of burial to assist the departed on their journey through the afterlife. Therefore, ancient peoples",
 o:["may have believed that the materials and items would be beneficial in the afterlife.","were frightened that evil spirits would steal these offerings from their loved ones.","practiced these formal rites to help survivors forget about the person who died.","conducted these rituals to come to terms with their own eventual deaths."]},
{p:"A company that can be purchased with little need for restructuring is called a turnkey company, which is appealing to potential buyers. For example, a fully-functioning and profitable sandwich franchise whose owner simply wants to pass off the business and retire would qualify as a turnkey company. Conversely, a boat repair business that has no working machines and minimal staff is not a turnkey company, because",
 o:["investors who are interested in sandwich franchises have no interest in boat repair shops.","it likely has substantial debts, which have prevented it from repairing its machines.","it will require a substantial amount of work to become profitable for a new owner.","boats are generally considered unprofitable investments by their owners."]},
{p:"Nepalese musician Sajjan Raj Vaidya attributes his love of music to his family. According to Vaidya, his mother taught him how to sing, his father taught him how to listen to music, and his brother helped him evolve his understanding of composition. One of Vaidya's most popular projects is “Katha”, a video series that features both an acoustic rendition of a song and a discussion of the song's origin and composition. This information suggests that",
 o:["in Nepal, Vaidya is celebrated as a revolutionary artist.","Vaidya's family often performs with him on stage when he is touring.","Vaidya has extensive training in videography as well as music.","an aspect of Vaidya's music education is featured in one of his works."]}
];
const L="ABCD";
let state=JSON.parse(localStorage.getItem("inf1")||"{}");
function save(){try{localStorage.setItem("inf1",JSON.stringify(state))}catch(e){}}
let cur=0;
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();window.scrollTo(0,0)}
function jump(i){cur=i;render();window.scrollTo(0,0)}
function render(){
  const i=cur,q=Q[i];
  document.getElementById("app").innerHTML=`
  <div class="q"><span class="num">${i+1}</span>
  <div class="passage">${q.p} ______</div>
  <div class="ask">Which choice most logically completes the text?</div>
  ${q.o.map((t,j)=>`<div class="opt ${state[i]===j?'sel':''} ${(state['x'+i]||[]).includes(j)?'cross':''}" onclick="pick(${i},${j})" ondblclick="cross(${i},${j})"><b>${L[j]}</b><span>${t}</span></div>`).join("")}
  </div>`;
  document.getElementById("dots").innerHTML=Q.map((_,k)=>`<button class="dot ${k===cur?'cur':''} ${state[k]!==undefined?'done':''}" onclick="jump(${k})">${k+1}</button>`).join("");
  document.getElementById("counter").textContent=`Question ${i+1} of ${Q.length}`;
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===Q.length-1;
}
function pick(i,j){state[i]=state[i]===j?undefined:j;save();render()}
function cross(i,j){const k='x'+i;let a=state[k]||[];a=a.includes(j)?a.filter(x=>x!==j):[...a,j];state[k]=a;save();render()}
function resetAll(){state={};save();render()}
render();
</script>
</body>
</html>
